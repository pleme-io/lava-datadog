[package]
authors = ["pleme-io"]
description = "lava-datadog — autogenerated typed (deflava-resource …) shapes for the datadog terraform provider. Mirrors pangea-datadog. Source schema kept under schema.json; resources/*.tlisp + _index.tlisp regenerated via `lava-forge generate --schema schema.json --out resources`."
edition = "2024"
license = "MIT"
name = "lava-datadog"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-datadog"
version = "0.1.1"

[lib]
name = "lava_datadog"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"
